sentence=Non-blocking melody playback for ESP32 using a compact text-based note encoding.
paragraph=Play melodies through a piezo buzzer with a simple string format. Playback runs on a dedicated FreeRTOS task pinned to a configurable core, keeping the main loop fully responsive. Supports 85 notes (C1-C8), runtime BPM changes, and immediate playback control.
